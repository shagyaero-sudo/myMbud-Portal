<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>myMbud Portal</title>

    <!-- PRELOAD BACKSOUND AUDIO UNTUK INSTANT PLAY PAS LOGIN -->
    <link rel="preload" href="/backsound.mp3" as="audio" type="audio/mpeg" />

    <!-- Font SF Pro via CDN untuk Android & Windows -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sf-font@1.0.0/stylesheet.css">
    
    <!-- Syarat PWA (Manifest KTP Aplikasi) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon Standar -->
    <link rel="icon" type="image/png" href="/logombud.png" />
    
    <!-- Icon Khusus Apple (iPhone & iPad) -->
    <link rel="apple-touch-icon" href="/logombud.png" />
    
    <!-- Meta Tags Khusus iOS/iPadOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="myMbud" />

    <!-- Meta Tag Android / PWA Status Bar Default Charcoal -->
    <meta name="theme-color" content="#121214" />
    <meta name="color-scheme" content="dark light" />

    <!-- SCRIPT CEGAH FLICKER & MEMBACA SISTEM TEMA 2-LAYER -->
    <script>
      (function() {
        const savedMode = localStorage.getItem('mymbud_theme_mode') || 'dark';
        const savedAccent = localStorage.getItem('mymbud_theme_accent') || 'blue';
        const root = document.documentElement;
        
        root.setAttribute('data-mode', savedMode);
        root.setAttribute('data-accent', savedAccent);

        if (savedMode === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        const metaThemeColor = document.querySelector("meta[name='theme-color']");
        if (metaThemeColor) {
          metaThemeColor.setAttribute('content', savedMode === 'dark' ? '#121214' : '#ffffff');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-zinc-950 text-slate-800 dark:text-zinc-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>myMbud Portal</title>
    
    <!-- Syarat PWA (Manifest KTP Aplikasi) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon Standar -->
    <link rel="icon" type="image/png" href="/logombud.png" />
    
    <!-- Icon Khusus Apple (iPhone & iPad) -->
    <link rel="apple-touch-icon" href="/logombud.png" />
    
    <!-- Meta Tags Khusus iOS/iPadOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myMbud" />

    <!-- Meta Tag Android Adaptif -->
    <meta name="theme-color" content="#f8fafc" />

    <!-- SCRIPT CEGAH FLICKER & MEMBACA 3 TEMA -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const root = document.documentElement;
        
        if (savedTheme === 'pink') {
          root.classList.add('pink');
          root.classList.remove('dark');
        } else if (savedTheme === 'dark' || savedTheme === null) {
          root.classList.add('dark');
          root.classList.remove('pink');
          if (savedTheme === null) {
            localStorage.setItem('theme', 'dark');
          }
        } else {
          root.classList.remove('dark', 'pink');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-zinc-950 text-slate-800 dark:text-zinc-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const root = document.documentElement;
        
        if (savedTheme === 'green') {
          root.classList.add('green');
          root.classList.remove('dark', 'pink', 'purple');
        } else if (savedTheme === 'purple') {
          root.classList.add('purple');
          root.classList.remove('dark', 'pink', 'green');
        } else if (savedTheme === 'pink') {
          root.classList.add('pink');
          root.classList.remove('dark', 'purple', 'green');
        } else if (savedTheme === 'dark' || savedTheme === null) {
          root.classList.add('dark');
          root.classList.remove('pink', 'purple', 'green');
          if (savedTheme === null) {
            localStorage.setItem('theme', 'dark');
          }
        } else {
          root.classList.remove('dark', 'pink', 'purple', 'green');
        }
      })();
    </script>

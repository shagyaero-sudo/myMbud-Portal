<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Burger Rush</title>
<style>
  :root {
    --bg1: #ffb347; --bg2: #ff7043;
    --panel: #fff8ee;
    --ink: #4a2c17;
    --bun-top: #e8a63d; --bun-bottom: #d9922a;
    --patty: #6b3f2a; --patty-dark: #4f2c1c;
    --cheese: #ffcc33; --cheese-dark: #e8b400;
    --lettuce: #7cb342; --lettuce-dark: #558b2f;
    --tomato: #e64a3f; --tomato-dark: #c1372e;
    --onion: #f3e5ff; --onion-line: #c9a6e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 8px;
  }

  h1 { font-size: 16px; margin: 2px 0 6px; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,0.25); }

  #topBar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 420px;
    padding: 0 6px;
    font-size: 12px; font-weight: 800; color: #fff;
  }

  /* ---- Customer ticket queue ---- */
  #queue {
    display: flex; gap: 8px;
    margin: 8px 0;
    min-height: 92px;
  }
  .ticket {
    background: var(--panel);
    border-radius: 10px;
    padding: 6px 8px;
    width: 96px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    position: relative;
    transition: transform 0.2s, opacity 0.2s;
  }
  .ticket.active { box-shadow: 0 0 0 3px #ffd43b, 0 4px 10px rgba(0,0,0,0.3); transform: translateY(-3px); }
  .ticket .face { font-size: 20px; }
  .ticket .order-icons { display: flex; flex-direction: column-reverse; gap: 1px; }
  .ticket .order-icons .ico { font-size: 12px; line-height: 1; }
  .patience-bar { width: 100%; height: 5px; background: rgba(0,0,0,0.15); border-radius: 3px; overflow: hidden; }
  .patience-fill { height: 100%; background: #51cf66; transition: width 0.1s linear, background 0.3s; }

  /* ---- Assembly area ---- */
  #assembly {
    background: var(--panel);
    border-radius: 16px;
    width: 100%; max-width: 420px;
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end;
    padding: 12px 10px 10px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    position: relative;
    min-height: 180px;
  }
  #plate {
    width: 130px;
    display: flex; flex-direction: column-reverse;
    align-items: center;
    min-height: 20px;
    margin-bottom: 8px;
  }
  .layer {
    width: 108px;
    height: 16px;
    margin-top: -4px;
    position: relative;
    animation: dropIn 0.25s ease-out;
  }
  @keyframes dropIn {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .layer.bun-bottom { height: 20px; background: var(--bun-bottom); border-radius: 8px 8px 4px 4px; }
  .layer.bun-top {
    height: 30px;
    background: radial-gradient(ellipse at 50% 30%, var(--bun-top), var(--bun-bottom));
    border-radius: 60px 60px 6px 6px;
  }
  .layer.bun-top::before, .layer.bun-top::after, .layer.bun-top .seed {
    content: ""; position: absolute; width: 4px; height: 2px; background: #fff3d6; border-radius: 50%;
  }
  .layer.patty { height: 16px; background: linear-gradient(180deg, var(--patty), var(--patty-dark)); border-radius: 6px; }
  .layer.cheese {
    height: 12px;
    background: linear-gradient(180deg, var(--cheese), var(--cheese-dark));
    clip-path: polygon(0% 30%, 100% 0%, 100% 70%, 0% 100%);
    width: 118px;
  }
  .layer.lettuce {
    height: 10px;
    background: var(--lettuce);
    clip-path: polygon(0% 40%, 10% 10%, 20% 40%, 30% 5%, 40% 40%, 50% 10%, 60% 40%, 70% 5%, 80% 40%, 90% 10%, 100% 40%, 100% 100%, 0% 100%);
    width: 120px;
  }
  .layer.tomato { height: 8px; display: flex; justify-content: space-evenly; align-items: center; }
  .layer.tomato .slice { width: 22px; height: 8px; background: var(--tomato); border-radius: 50%; border: 1.5px solid var(--tomato-dark); }
  .layer.onion {
    height: 8px;
    background: repeating-linear-gradient(90deg, var(--onion), var(--onion) 6px, var(--onion-line) 6px, var(--onion-line) 8px);
    border-radius: 4px;
    width: 112px;
  }

  #plateDish {
    width: 150px; height: 14px;
    background: #dcdcdc;
    border-radius: 50%;
    box-shadow: 0 3px 4px rgba(0,0,0,0.2);
  }

  #serveBtn {
    padding: 9px 24px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(160deg, #40c057, #2f9e44);
    color: #fff;
    font-weight: 900;
    font-size: 13px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    cursor: pointer;
    margin-top: 4px;
  }
  #serveBtn:disabled { opacity: 0.4; cursor: default; }
  #serveBtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }

  #hint {
    font-size: 11px; font-weight: 700; color: var(--ink); opacity: 0.7;
    margin-top: 2px; min-height: 14px;
  }

  /* ---- Ingredient station ---- */
  #station {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%; max-width: 420px;
    margin-top: 10px;
  }
  .ingBtn {
    background: var(--panel);
    border: none;
    border-radius: 12px;
    padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; color: var(--ink);
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    cursor: pointer;
  }
  .ingBtn .emoji { font-size: 20px; }
  .ingBtn:active { transform: translateY(2px); box-shadow: none; }
  .ingBtn.next-needed { box-shadow: 0 0 0 3px #ffd43b, 0 3px 0 rgba(0,0,0,0.15); }
  .ingBtn.shake { animation: shakeErr 0.3s; }
  @keyframes shakeErr {
    0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
  }

  #scorePopup {
    position: absolute;
    font-weight: 900;
    font-size: 20px;
    color: #ffd43b;
    text-shadow: 0 2px 2px rgba(0,0,0,0.4);
    pointer-events: none;
    opacity: 0;
    top: 30%; left: 50%;
    transform: translate(-50%, 0);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -40px); }
  }
  #scorePopup.show { animation: floatUp 0.8s ease-out; }

  #gameOverOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    z-index: 30;
  }
  #gameOverOverlay.show { display: flex; }
  #gameOverOverlay h2 { color: #fff; margin: 0; font-size: 22px; }
  #gameOverOverlay p { color: #ffe8b3; margin: 0; font-size: 14px; }
  #gameOverOverlay button {
    padding: 10px 26px; border-radius: 999px; border: none;
    background: linear-gradient(160deg, #ffd43b, #f59f00);
    color: #4a2e00; font-weight: 800; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

<h1>🍔 Burger Rush</h1>
<div id="topBar">
  <span id="scoreText">Skor: 0</span>
  <span id="livesText">❤️❤️❤️</span>
</div>

<div id="queue"></div>

<div id="assembly">
  <div id="scorePopup"></div>
  <div id="plate"></div>
  <div id="plateDish"></div>
  <button id="serveBtn" disabled>Sajikan!</button>
  <div id="hint">Klik bahan sesuai pesanan</div>
</div>

<div id="station"></div>

<div id="gameOverOverlay">
  <h2>Waktunya Habis!</h2>
  <p id="finalScore">Skor akhir: 0</p>
  <button id="restartBtn">Main Lagi</button>
</div>

<script>
(() => {
  const INGREDIENTS = [
    { id: 'patty', label: 'Daging', emoji: '🥩' },
    { id: 'cheese', label: 'Keju', emoji: '🧀' },
    { id: 'lettuce', label: 'Selada', emoji: '🥬' },
    { id: 'tomato', label: 'Tomat', emoji: '🍅' },
    { id: 'onion', label: 'Bawang', emoji: '🧅' },
    { id: 'patty2', label: 'Daging 2x', emoji: '🥩', mapsTo: 'patty' },
  ];
  const CUSTOMER_FACES = ['😀', '😎', '🥳', '🤠', '😺', '👧', '👦', '🧑', '👩', '👨'];

  let score = 0;
  let lives = 3;
  let queue = []; // {order: ['patty','cheese',...], patience: 0..100, id}
  let currentOrderIdx = 0;
  let building = []; // ingredients placed so far (excluding buns)
  let nextCustomerId = 1;
  let gameOver = false;
  let tickTimer = null;

  function randomOrder() {
    const pool = ['patty', 'cheese', 'lettuce', 'tomato', 'onion'];
    const len = 2 + Math.floor(Math.random() * 3); // 2-4 fillings
    const order = [];
    order.push('patty'); // always start with a patty for a burger that makes sense
    for (let i = 1; i < len; i++) {
      order.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    return order;
  }

  function spawnCustomer() {
    if (queue.length >= 3) return;
    queue.push({
      id: nextCustomerId++,
      order: randomOrder(),
      patience: 100,
      face: CUSTOMER_FACES[Math.floor(Math.random() * CUSTOMER_FACES.length)],
    });
  }

  function renderAll() {
    renderQueue();
    renderPlate();
    renderStation();
    updateServeBtn();
  }

  function iconFor(ingId) {
    const ing = INGREDIENTS.find(i => i.id === ingId);
    return ing ? ing.emoji : '?';
  }

  function renderQueue() {
    const q = document.getElementById('queue');
    q.innerHTML = '';
    queue.forEach((cust, idx) => {
      const el = document.createElement('div');
      el.className = 'ticket' + (idx === currentOrderIdx ? ' active' : '');
      el.innerHTML =
        '<span class="face">' + cust.face + '</span>' +
        '<div class="order-icons">' + cust.order.map(i => '<span class="ico">' + iconFor(i) + '</span>').join('') + '</div>' +
        '<div class="patience-bar"><div class="patience-fill" style="width:' + cust.patience + '%; background:' + patienceColor(cust.patience) + '"></div></div>';
      el.addEventListener('click', () => { currentOrderIdx = idx; renderQueue(); });
      q.appendChild(el);
    });
  }

  function patienceColor(p) {
    if (p > 50) return '#51cf66';
    if (p > 25) return '#fab005';
    return '#fa5252';
  }

  function renderPlate() {
    const plate = document.getElementById('plate');
    plate.innerHTML = '';
    const bottom = document.createElement('div');
    bottom.className = 'layer bun-bottom';
    plate.appendChild(bottom);
    building.forEach(ing => {
      const layer = document.createElement('div');
      layer.className = 'layer ' + ing;
      if (ing === 'tomato') {
        layer.innerHTML = '<div class="slice"></div><div class="slice"></div><div class="slice"></div>';
        layer.style.display = 'flex';
      }
      plate.appendChild(layer);
    });
    if (building.length >= currentTargetLength()) {
      const top = document.createElement('div');
      top.className = 'layer bun-top';
      plate.appendChild(top);
    }
  }

  function currentTargetLength() {
    const cust = queue[currentOrderIdx];
    return cust ? cust.order.length : 0;
  }

  function currentOrder() {
    const cust = queue[currentOrderIdx];
    return cust ? cust.order : null;
  }

  function nextNeededIngredient() {
    const order = currentOrder();
    if (!order) return null;
    if (building.length >= order.length) return null;
    return order[building.length];
  }

  function renderStation() {
    const station = document.getElementById('station');
    station.innerHTML = '';
    const needed = nextNeededIngredient();
    INGREDIENTS.forEach(ing => {
      const btn = document.createElement('button');
      btn.className = 'ingBtn';
      const targetId = ing.mapsTo || ing.id;
      if (needed && targetId === needed) btn.classList.add('next-needed');
      btn.innerHTML = '<span class="emoji">' + ing.emoji + '</span><span>' + ing.label + '</span>';
      btn.addEventListener('click', () => onIngredientClick(targetId, btn));
      station.appendChild(btn);
    });
  }

  function onIngredientClick(ingId, btnEl) {
    if (gameOver) return;
    const order = currentOrder();
    if (!order) return;
    const needed = nextNeededIngredient();
    if (needed === ingId) {
      building.push(ingId);
      renderPlate();
      renderStation();
      updateServeBtn();
    } else {
      btnEl.classList.remove('shake');
      void btnEl.offsetWidth;
      btnEl.classList.add('shake');
      showHint('Salah bahan! Cek pesanan lagi.');
    }
  }

  function updateServeBtn() {
    const order = currentOrder();
    const btn = document.getElementById('serveBtn');
    btn.disabled = !(order && building.length === order.length);
  }

  function showHint(text) {
    const h = document.getElementById('hint');
    h.textContent = text;
    clearTimeout(showHint._t);
    showHint._t = setTimeout(() => { h.textContent = 'Klik bahan sesuai pesanan'; }, 1400);
  }

  function popScore(amount) {
    const el = document.getElementById('scorePopup');
    el.textContent = '+' + amount;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }

  function serve() {
    const cust = queue[currentOrderIdx];
    if (!cust) return;
    const points = Math.round(10 + cust.patience * 0.5);
    score += points;
    popScore(points);
    document.getElementById('scoreText').textContent = 'Skor: ' + score;
    queue.splice(currentOrderIdx, 1);
    currentOrderIdx = 0;
    building = [];
    if (queue.length === 0) spawnCustomer();
    renderAll();
  }

  function loseLife() {
    lives--;
    document.getElementById('livesText').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - lives);
    if (lives <= 0) {
      endGame();
    }
  }

  function endGame() {
    gameOver = true;
    clearInterval(tickTimer);
    document.getElementById('finalScore').textContent = 'Skor akhir: ' + score;
    document.getElementById('gameOverOverlay').classList.add('show');
  }

  function tick() {
    if (gameOver) return;
    let someoneLeft = false;
    queue.forEach(c => { c.patience -= 0.6; });
    for (let i = queue.length - 1; i >= 0; i--) {
      if (queue[i].patience <= 0) {
        queue.splice(i, 1);
        someoneLeft = true;
        if (i <= currentOrderIdx) { currentOrderIdx = 0; building = []; }
      }
    }
    if (someoneLeft) {
      loseLife();
      if (queue.length === 0 && !gameOver) spawnCustomer();
      renderAll();
    } else {
      renderQueue();
    }
  }

  function restart() {
    score = 0;
    lives = 3;
    queue = [];
    currentOrderIdx = 0;
    building = [];
    gameOver = false;
    document.getElementById('scoreText').textContent = 'Skor: 0';
    document.getElementById('livesText').textContent = '❤️❤️❤️';
    document.getElementById('gameOverOverlay').classList.remove('show');
    spawnCustomer();
    spawnCustomer();
    renderAll();
    clearInterval(tickTimer);
    tickTimer = setInterval(tick, 100);
  }

  document.getElementById('serveBtn').addEventListener('click', serve);
  document.getElementById('restartBtn').addEventListener('click', restart);

  restart();
})();
</script>
</body>
</html>
